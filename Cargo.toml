[package]
name = "cargo-rcurl"
version = "0.0.36"
edition = "2024"
description = "A modern, feature-rich curl alternative written in Rust"
license = "MIT"
repository = "https://github.com/lsk569937453/rcurl"
homepage = "https://github.com/lsk569937453/rcurl"
documentation = "https://docs.rs/cargo-rcurl"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "rcurl"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.103"
async-tls = "=0.13.0"
bytes = "=1.12.0"
chrono = "=0.4.45"
clap = { version = "=4.6.1", features = ["derive", "string"] }
crossterm = "=0.29.0"
env_logger = "=0.11.11"
form-data-builder = "=1.0.1"
futures = "=0.3.32"
futures-util = { version = "=0.3.32", default-features = false }
hickory-resolver = "=0.26.1"
http = "=1.4.2"
http-body-util = { version = "=0.1.3" }
http-range-header = "=0.4.2"
hyper = { version = "=1.10.1", features = ["full"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
    "http1",
    "http2",
] }
hyper-util = { version = "=0.1.20", features = ["full"] }
indicatif = "=0.18.6"
inquire = "=0.9.4"
log = "=0.4.33"
mime_guess = "=2.0.5"
netstat2 = "=0.11"
ping = "=0.8.0"
pki-types = { package = "rustls-pki-types", version = "=1.15.0" }
ratatui = "=0.30.2"
rayon = "=1.12.0"
rustls = { version = "=0.23.41", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
shell-words = "=1.1.1"
suppaftp = { version = "=10.0.0", features = ["rustls-ring"] }
sysinfo = "0.39"
telnet = "=0.2.4"
tokio = { version = "=1.52.3", features = ["full"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = [
    "logging",
    "ring",
] }
tokio-util = { version = "=0.7.18", features = ["full", "time"] }
tower-service = "=0.3.3"
tracing = { version = "=0.1.44" }
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.8"
walkdir = "=2.5.0"
webpki-roots = "=1.0.8"
x509-parser = "=0.18.1"
[target.'cfg(unix)'.dependencies]
sysinfo = "0.39"

# Cross-platform socket information library
