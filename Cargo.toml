[package]
name = "cargo-rcurl"
version = "0.0.36"
edition = "2024"
description = "A modern, feature-rich curl alternative written in Rust"
license = "MIT"
repository = "https://github.com/lsk569937453/rcurl"
homepage = "https://github.com/lsk569937453/rcurl"
documentation = "https://docs.rs/cargo-rcurl"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "rcurl"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.105"
async-tls = "=0.13.0"
bytes = "=1.12.2"
chrono = "=0.4.45"
clap = { version = "=4.6.10", features = ["derive", "string"] }
crossterm = "=0.29.0"
env_logger = "=0.11.12"
form-data-builder = "=1.0.1"
futures = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false }
git2 = "=0.21.0"
hdrhistogram = "=7.6.0"
hickory-resolver = "=0.26.4"
http = "=1.5.0"
http-body-util = { version = "=0.1.5" }
http-range-header = "=1.1.0"
hyper = { version = "=1.13.0", features = ["full"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
    "http1",
    "http2",
] }
hyper-util = { version = "=0.1.21", features = ["full"] }
ignore = "=0.4.35"
indicatif = "=0.18.6"
inquire = "=0.9.5"
log = "=0.4.35"
mime_guess = "=2.0.5"
netstat2 = "=0.11"
ping = "=0.10.0"
pki-types = { package = "rustls-pki-types", version = "=1.16.0" }
ratatui = "=0.30.2"
rayon = "=1.12.0"
rustls = { version = "=0.23.46", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
suppaftp = { version = "=13.0.0", features = ["rustls-ring"] }
sysinfo = "0.40"
telnet = "=0.2.5"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = [
    "logging",
    "ring",
] }
tokio-util = { version = "=0.7.20", features = ["full", "time"] }
tower-service = "=0.3.3"
tracing = { version = "=0.1.44" }
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.9"
walkdir = "=2.5.1"
webpki-roots = "=1.0.12"
x509-parser = "=0.18.1"
[target.'cfg(unix)'.dependencies]
sysinfo = "0.40"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# Cross-platform socket information library
